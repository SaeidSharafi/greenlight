version: '3'

services:
  postgres:
    image: postgres:14.6-alpine3.17
    container_name: postgres
    restart: unless-stopped
    volumes:
      - ./data/postgres/14/database_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=

  redis:
    image: redis:6.2-alpine3.17
    container_name: redis
    restart: unless-stopped
    volumes:
      - ./data/redis/database_data:/data

  greenlight-v3:
    entrypoint: [bin/start]
    image: bigbluebutton/greenlight:v3
    container_name: greenlight-v3
    restart: unless-stopped
    env_file: .env
    ports:
      - 127.0.0.1:5050:3000
    logging:
      driver: journald
    volumes:
      - ./data/greenlight-v3/storage:/usr/src/app/storage
      - ./lib/tasks/custom:/usr/src/app/lib/tasks/custom
      - ./config/initializers/locales.rb:/usr/src/app/config/initializers/locales.rb
      - ./app/models/user.rb:/usr/src/app/app/models/user.rb
      - ./config/locales/fa.yml:/usr/src/app/config/locales/fa.yml
      - ./config/locales/fa_IR.yml:/usr/src/app/config/locales/fa_IR.yml
      - ./config/environments/production.rb:/usr/src/app/config/environments/production.rb
      - ./app/assets/fonts:/usr/src/app/app/assets/fonts
      - ./app/assets/images:/usr/src/app/app/assets/images
      - ./app/assets/stylesheets:/usr/src/app/app/assets/stylesheets
      - ./app/assets/locales/fa.json:/usr/src/app/app/assets/locales/fa.json
      - ./app/javascript:/usr/src/app/app/javascript
      - ./app/views/layouts/application.html.erb:/usr/src/app/app/views/layouts/application.html.erb
      - ./public/favicon.ico:/usr/src/app/public/favicon.ico
    depends_on:
      - postgres
      - redis
